spring:
  application:
    name: TinTucTacGia

  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

#  Thêm JWT config (dùng cho JwtService)
jwt:
  # Secret key phải >= 32 ký tự
  secret: day-la-secret-key-cua-ban-doi-thanh-gia-tri-that
  # Thời gian hết hạn token: 1 giờ = 3600000 ms
  expiration: 3600000